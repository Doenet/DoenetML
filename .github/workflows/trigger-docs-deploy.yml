# Rebuild docs.doenet.org after a push to this maintenance branch.
#
# The site serves this branch's docs at the root, beside `main`'s at `/dev/`.
# Both are built and deployed together by `gh-pages-docs.yml` on `main`: a
# Pages deploy replaces the whole site, and the `github-pages` environment
# accepts deploys only from `main`. So this branch never deploys; it asks
# `main`'s workflow to run, which builds this branch's current tip. See
# "The docs site" in `main`'s docs/RELEASING.md.
#
# A workflow_dispatch made with GITHUB_TOKEN does start a run, unlike most
# events that token causes.
name: Trigger docs deploy

on:
    push:
        branches: ["0.7"]
        # Changesets and the version PR's bookkeeping change nothing the docs
        # build from. (A release needs no rebuild either: the docs' examples
        # load `@doenet/standalone@0.7` from the CDN, which follows releases.)
        paths-ignore:
            - ".changeset/**"
            - "**/CHANGELOG.md"
    workflow_dispatch:

permissions:
    actions: write

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            - name: Run gh-pages-docs.yml on main
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run gh-pages-docs.yml --repo "${{ github.repository }}" --ref main
