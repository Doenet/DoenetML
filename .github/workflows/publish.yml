name: Publish

# The 0.7 maintenance line. Differences from `main`'s copy, all deliberate:
#
#   * No `workflow_run` trigger. GitHub always runs a `workflow_run` workflow
#     from the *default* branch, so a copy here could never be what executes --
#     which is why this line's dev channel is `workflow_dispatch` only, and why
#     its stable releases come from the `release` event, whose workflow file
#     does come from the tagged commit.
#   * No VS Code extension. The Marketplace and Open VSX each carry a single
#     ascending version stream, so an 0.7.x extension published after 0.8.x is
#     either rejected or has to claim a version it does not have.
#   * Publishes under `0.7-stable` / `0.7-dev`, never `latest` / `dev`. The
#     per-package `publish` scripts on this branch pin `--tag 0.7-stable`, so
#     even a bare `npm run publish` by hand cannot move `latest`.
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            channel:
                description: Release channel
                required: true
                type: choice
                options:
                    - dev
                    - production
            dry_run:
                description: Skip npm publish
                required: true
                type: boolean
                default: true
            tag:
                description: Production tag override for manual runs
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
    cancel-in-progress: false

jobs:
    dev-release:
        name: Dev Release
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'dev' }}
        permissions:
            actions: read
            id-token: write
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}

            - name: Determine checked out commit SHA
              id: checked-sha
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Verify CI succeeded for target commit
              # `verify-ci.mjs` now waits out a CI run that is still going
              # rather than failing on it, under a 60-minute budget of its own.
              # This is the backstop on that wait, so a hanging API read cannot
              # hold the runner indefinitely.
              timeout-minutes: 70
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  TARGET_SHA: ${{ steps.checked-sha.outputs.sha }}
              run: node .github/scripts/verify-ci.mjs

            - name: Update versions
              run: |
                  CURRENT_VERSION=$(node -p "require('./packages/doenetml/package.json').version")
                  VERSION="${CURRENT_VERSION}-dev.${{ github.run_number }}"
                  npm run version -- ${VERSION} --no-git-tag-version

            - name: Build workspaces
              run: |
                  export NODE_OPTIONS="--max_old_space_size=6114"
                  npm run build -w packages/doenetml -w packages/standalone -w packages/doenetml-iframe -w packages/v06-to-v07
              env:
                  WIREIT_CACHE: "local"
                  # `main`'s copy overrides this to @latest so a dev build keeps
                  # working before a prefigure bump reaches npm. Not here: on the
                  # maintenance line @latest is whatever the *current* line last
                  # published, so the override would pull an 0.8-era runtime into
                  # a 0.7 build. Falling through to the exact pin in
                  # `prefigureConfig.ts` is the point.

            - name: Publish dev release
              id: publish-npm
              if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
              run: npm run publish -- --tag 0.7-dev
              env:
                  WIREIT_CACHE: "local"

            # Waits for npm to finish processing the publish, and then for
            # jsDelivr to fetch it, before purging — so this is minutes rather
            # than seconds; see `jsdelivr-purge-lib.sh`. The script gives each
            # wait its own wall-clock budget (20 and 15 minutes) and then sleeps
            # about another 8 between its purge retries; `timeout-minutes` is
            # the backstop over the whole of that, since the requests themselves
            # are bounded one at a time rather than in aggregate, and it keeps a
            # wedged one from holding the runner.
            #
            # Gated on the publish having *run*, not on it having succeeded:
            # `npm run publish` is four independent workspace publishes and npm
            # does not stop at the first one that fails, so a failed step tells
            # you nothing about whether @doenet/standalone went out. Skipping
            # the purge on that signal would leave `dev` on the CDN a release
            # behind for 12 hours because some unrelated package failed. The
            # registry wait inside the script is the real gate: it refuses to
            # purge until npm serves this version under the tag.
            - name: Purge jsDelivr cache
              if: >-
                  !cancelled() &&
                  (steps.publish-npm.outcome == 'success' ||
                   steps.publish-npm.outcome == 'failure')
              timeout-minutes: 50
              run: bash .github/scripts/purge-jsdelivr.sh 0.7-dev

    production-release:
        name: Production Release
        runs-on: ubuntu-latest
        environment: production
        if: >-
            github.event_name == 'release' ||
            (github.event_name == 'workflow_dispatch' && inputs.channel == 'production')
        permissions:
            actions: read
            id-token: write
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.tag != '' && inputs.tag || github.ref) }}
                  fetch-depth: 0

            - name: Determine checked out commit SHA
              id: checked-sha
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Verify CI succeeded for target commit
              # `verify-ci.mjs` now waits out a CI run that is still going
              # rather than failing on it, under a 60-minute budget of its own.
              # This is the backstop on that wait, so a hanging API read cannot
              # hold the runner indefinitely.
              timeout-minutes: 70
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  TARGET_SHA: ${{ steps.checked-sha.outputs.sha }}
              run: node .github/scripts/verify-ci.mjs

            - name: Resolve release tag
              id: release-tag
              env:
                  EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
                  INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
              run: |
                  TAG="${EVENT_TAG}"
                  if [ -z "${TAG}" ]; then
                      if [ -n "${INPUT_TAG}" ]; then
                          TAG="${INPUT_TAG}"
                      else
                          echo "Error: For manual production runs, the 'tag' input is required. Please provide the tag (e.g. v1.2.3)." >&2
                          exit 1
                      fi
                  fi

                  TAG="${TAG#refs/tags/}"
                  NORMALIZED="${TAG#v}"
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${NORMALIZED}" >> "$GITHUB_OUTPUT"
                  echo "Resolved release tag: ${TAG}"

            - name: Validate tag matches package versions
              env:
                  RELEASE_VERSION: ${{ steps.release-tag.outputs.version }}
              run: node .github/scripts/validate-tag-versions.mjs

            - name: Verify tag commit is on the 0.7 branch
              run: |
                  git fetch origin 0.7
                  if ! git merge-base --is-ancestor HEAD origin/0.7; then
                      echo "Error: release tag commit is not reachable from origin/0.7" >&2
                      exit 1
                  fi

            - name: Build workspaces
              run: |
                  export NODE_OPTIONS="--max_old_space_size=6114"
                  npm run build -w packages/doenetml -w packages/standalone -w packages/doenetml-iframe -w packages/v06-to-v07
              env:
                  WIREIT_CACHE: "local"

            - name: Publish production release
              id: publish-npm
              if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
              run: npm run publish
              env:
                  WIREIT_CACHE: "local"

            # Last, and deliberately so. The purge waits for npm to finish
            # processing the publish and then for jsDelivr to fetch it before it
            # fires, which takes minutes rather than seconds (see
            # `jsdelivr-purge-lib.sh`), and it now fails the job when the tag
            # will not move. Neither should stand between a
            # published npm release and the extension registries: those do not
            # depend on the CDN, and a purge that has to be re-run should not
            # take the Marketplace publish with it.
            #
            # The condition is what keeps that from cutting the other way. Being
            # last, this step would otherwise be skipped whenever a step above
            # failed — leaving `latest` on the CDN a release behind for 12 hours
            # because an extension registry was down. `!cancelled()` runs it
            # anyway, and it is tied to the npm publish instead.
            #
            # Tied to that step having *run*, though, not to it having
            # succeeded. `npm run publish` is four independent workspace
            # publishes and npm does not stop at the first one that fails, so a
            # failed step is equally consistent with @doenet/standalone — the
            # only package this purges — having published fine while
            # `v06-to-v07` did not. Naming the two outcomes the step can have
            # when it ran leaves out the case that genuinely has nothing to
            # purge: the dry run, where it does not run at all. Whether
            # standalone did publish is then decided where it can be — by the
            # registry wait inside the script, which refuses to purge until npm
            # serves this version under the tag, and fails the step if it never
            # does.
            #
            # `timeout-minutes` is the backstop on the script's own waiting —
            # 20 minutes of registry wait, 15 of CDN wait and roughly 8 of
            # sleeps between purge retries, which is now spent once per
            # floating URL rather than once in total. That is about 52 minutes
            # of waiting in the worst case, which no longer fits under 50, so
            # the backstop is 60: a wedged request still cannot hold the
            # runner, and a slow-but-succeeding second purge is not cut off
            # partway by the backstop meant for a wedged one.
            #
            # Two floating URLs move on a production release, not one. `latest`
            # is the dist-tag; the line range is what a host pins when it sets
            # `doenetmlVersion="0.7"`, which jsDelivr resolves as an npm semver
            # range and caches for 12 hours like any other floating URL. It has
            # never been purged, so those hosts have been served the previous
            # release for up to half a day after each one. The line is derived
            # from the release rather than written down, so it follows the
            # version without anyone having to remember to change it.
            - name: Purge jsDelivr cache
              if: >-
                  !cancelled() &&
                  (steps.publish-npm.outcome == 'success' ||
                   steps.publish-npm.outcome == 'failure')
              timeout-minutes: 60
              env:
                  RELEASE_VERSION: ${{ steps.release-tag.outputs.version }}
              run: |
                  # No line range tracks a prerelease: `@0.7` is the npm range
                  # `>=0.7.0 <0.8.0`, and a semver range never matches a
                  # version with a prerelease part, so `0.8.0-beta1` is served
                  # by no range URL and has nothing cached under one. Asking
                  # for it anyway would verify the range against a version it
                  # cannot serve and fail a release that is perfectly fine, so
                  # a prerelease gets the dist-tag alone — the same reason the
                  # dev channel passes no extra spec.
                  #
                  # Build metadata is stripped before looking for the `-`, so
                  # that the test means "has a prerelease part" and not "has a
                  # hyphen": `1.0.0+build-1` carries one inside its `+` suffix
                  # and is a plain release that `1.0` does serve.
                  if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
                      echo "${RELEASE_VERSION} is a prerelease; no line range resolves to it. Purging the '0.7-stable' dist-tag only."
                      bash .github/scripts/purge-jsdelivr.sh 0.7-stable
                  else
                      LINE="$(echo "${RELEASE_VERSION}" | cut -d. -f1,2)"
                      echo "Purging the '0.7-stable' dist-tag and the '${LINE}' line range."
                      bash .github/scripts/purge-jsdelivr.sh 0.7-stable "" "${LINE}"
                  fi
