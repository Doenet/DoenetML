name: Changesets Version PR

on:
    push:
        branches:
            - "0.7"
    workflow_dispatch:

concurrency:
    # Keyed on the ref rather than global. The group used to be a bare
    # string, which was fine while only `main` ran this workflow; with a
    # maintenance line it is shared across branches, and
    # `cancel-in-progress` would let a push to one cancel the other's
    # version PR.
    group: changesets-version-pr-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    pull-requests: write

jobs:
    version:
        name: Create Version Packages PR
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Create or update version PR
              uses: changesets/action@v1
              with:
                  version: npm run version:changesets
                  title: "chore: version packages"
                  commit: "chore: version packages"
