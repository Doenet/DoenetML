name: Purge jsDelivr dev

# Moves the `dev` floating URL on jsDelivr to a dev release once npm serves it.
#
# Started by `publish.yml` → `dev-release` right after its npm publish, with the
# version it published. It is its own workflow, not a step of that job, because
# npm can take well over an hour to make @doenet/standalone available — the
# other packages from the same publish show up at once — and a wait that long
# inside the publish job failed releases that had published fine. Here the wait
# can be long and its polling slow, and a run that does fail says only that the
# CDN is behind, not that the release is.
#
# Can also be run by hand from the Actions tab, e.g. to purge for a release
# whose own run gave up.
on:
    workflow_dispatch:
        inputs:
            version:
                description: The @doenet/standalone dev version to purge for (e.g. 0.7.27-dev.695)
                required: true
                type: string

# Only the newest dev release matters: purging `@dev` serves whatever npm has
# tagged, so a run still waiting for an older release is cancelled when a newer
# one starts, rather than waiting out its budget for a tag that has moved past it.
# Keyed on the branch so that a maintenance line's copy of this workflow, which
# purges its own dev tag, does not cancel `main`'s.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    purge:
        name: Purge jsDelivr dev
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            # The registry wait gets three hours, polled every five minutes;
            # dev releases have taken up to 85 minutes to appear on npm. The CDN
            # wait (15 minutes) and the purge retries (about 8) follow it, so
            # `timeout-minutes` is the backstop over all three, there to keep a
            # wedged request from holding the runner.
            - name: Purge jsDelivr cache
              timeout-minutes: 220
              env:
                  VERSION: ${{ inputs.version }}
                  REGISTRY_POLL_INTERVAL: 300
                  REGISTRY_POLL_TIMEOUT: 10800
              run: bash .github/scripts/purge-jsdelivr.sh dev "${VERSION}"
