[package]
name = "cells-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Prototype DoenetML core organized around a flat list of f64 cells"

[dependencies]
# The symbolic engine (ADR 0011): the library the current DoenetML core calls
# through wasm, pinned by revision. Note: it enables serde_json's
# `arbitrary_precision`, which feature unification spreads to any binary that
# links this crate (DAST loading in those binaries only).
math-expressions = { git = "https://github.com/Doenet/math-expressions.git", rev = "13543bf1ce6c986f8b554b6a2cc20644a34319d9" }
num-complex = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-time = "1"

[features]
# Registers the prototype-only `<op>` tag, which the tests and golden
# documents use to exercise single operators. Enabled for this crate's own
# tests by the self-dependency below.
testing = []

[dev-dependencies]
cells-core = { path = ".", features = ["testing"] }
