[package]
name = "cells-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "wasm-bindgen binding exposing the cells core to a browser renderer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
web-time = "1"
cells-core = { path = "../cells-core" }
wasm-bindgen = "0.2"
serde_json.workspace = true
console_error_panic_hook = "0.1"

# wasm-opt (binaryen, whichever one wasm-pack finds) corrupts the function
# table of current wasm-bindgen output ("WebAssembly.Table.grow() failed",
# then "unreachable" on load); checked again with wasm-pack 0.15 and the
# system binaryen in October 2026. The Rust release profile already
# optimizes; skip it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
