# Operators as data against operators as code: the harness behind
# docs/operators-data-vs-code.md. Not a member of the cells-core workspace,
# so its Cranelift dependency stays out of the core's build.
[workspace]

[package]
name = "opbench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["jit"]
aot = []
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[dependencies]
cells-core = { path = "../../crates/cells-core", features = ["testing"] }
cells-bench = { path = "../../crates/cells-bench" }
serde_json = "1"
cranelift-codegen = { version = "0.137", optional = true }
cranelift-frontend = { version = "0.137", optional = true }
cranelift-jit = { version = "0.137", optional = true }
cranelift-module = { version = "0.137", optional = true }
cranelift-native = { version = "0.137", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
[profile.opt0]
inherits = "release"
opt-level = 0
[profile.opt1]
inherits = "release"
opt-level = 1
[profile.opt2]
inherits = "release"
opt-level = 2
