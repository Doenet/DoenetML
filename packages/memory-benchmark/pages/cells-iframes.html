<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>cells core, iframe embed</title>
    </head>
    <body>
        <script>
            // The cells core's counterpart of iframes.html: N same-origin
            // iframes of the cells viewer's own page (served at /cells/),
            // each given the document through the viewer's window hook.
            // ?doc= selects the document from /doenetml-source.
            const params = new URLSearchParams(location.search);
            const n = parseInt(params.get("n") ?? "1", 10);
            const doc = params.get("doc") ?? "default";
            window.__done = false;
            window.__initializedCount = 0;
            (async () => {
                const source = await fetch(
                    "/doenetml-source?doc=" + encodeURIComponent(doc),
                ).then((r) => r.text());
                for (let i = 0; i < n; i++) {
                    const iframe = document.createElement("iframe");
                    iframe.style =
                        "width: 600px; height: 400px; display: block;";
                    iframe.src = "/cells/?blank=1";
                    document.body.appendChild(iframe);
                    (async () => {
                        const w = iframe.contentWindow;
                        while (!w.__cells) {
                            await new Promise((ok) => setTimeout(ok, 20));
                        }
                        await w.__cells.loadSource(source);
                        while (!w.__cells.ready) {
                            const err = w.document.querySelector(".error");
                            if (err) {
                                window.__loadError = err.textContent.slice(
                                    0,
                                    300,
                                );
                                return;
                            }
                            await new Promise((ok) => setTimeout(ok, 20));
                        }
                        window.__initializedCount++;
                    })();
                }
                window.__done = true;
            })();
        </script>
    </body>
</html>
